[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "penguin-lab"
version = "0.1.0"
description = "Statistical analysis and a simple scikit-learn model on the Palmer penguins dataset (CC0)."
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["pandas>=2.2", "scipy>=1.13", "scikit-learn>=1.5", "matplotlib>=3.9"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
